name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autopatch
          POSTGRES_PASSWORD: autopatch
          POSTGRES_DB: autopatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autopatch -d autopatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      API_KEY: dev-local-key
      DEVICE_ENROLLMENT_SECRET: dev-enrollment-secret
      GITHUB_WEBHOOK_SECRET: ci-test-webhook-secret
      DATABASE_URL: postgresql+psycopg://autopatch:autopatch@127.0.0.1:5432/autopatch
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
